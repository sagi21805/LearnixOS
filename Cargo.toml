[workspace]

members = [
    "bootloader/first_stage",
    "bootloader/second_stage",
    "crates/arch/x86",
    "crates/common",
    "crates/macros/bitfields",
    # "crates/drivers/ahci",
    "crates/drivers/keyboard",
    "crates/drivers/pci",
    "crates/drivers/vga-display",
    "crates/memory/buddy",
    "crates/memory/slab",
    "crates/memory/page",
    "crates/sync",
    "crates/libk",
    "kernel",
    # "snippets",
]

# xtask runs on the host and has its own workspace, so the bare-metal
# build target in `.cargo/config.toml` doesn't apply to it.
# typestate-groups is a submodule with its own workspace.
exclude = ["xtask", "crates/macros/typestate-groups"]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Internal crates
common = { path = "crates/common" }
x86 = { path = "crates/arch/x86" }
sync = { path = "crates/sync" }
libk = { path = "crates/libk" }
bitfields = { path = "crates/macros/bitfields" }
typestate-groups = { path = "crates/macros/typestate-groups/typestate-groups", default-features = false }
buddy = { path = "crates/memory/buddy" }
slab = { path = "crates/memory/slab" }
page = { path = "crates/memory/page" }
keyboard = { path = "crates/drivers/keyboard" }
vga_display = { path = "crates/drivers/vga-display" }
# ahci = { path = "crates/drivers/ahci" }
pci = { path = "crates/drivers/pci" }

# External crates used by more than one crate
num_enum = { git = "https://github.com/sagi21805/num_enum.git", default-features = false, features = [
    "complex-expressions",
] }
extend = "1.2.0"
thiserror = { version = "2.0.12", default-features = false }

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = 3
# overflow-checks = true
# Only `image-symbols/` keeps this, because `image.bin` holds loaded sections.
debug = true
codegen-units = 1
panic = "abort"

# The first stage must fit in the 512-byte boot sector and the second below
# the kernel at 0x10000, so xtask always builds them for size.
[profile.bootloader]
inherits = "release"
opt-level = 's'
