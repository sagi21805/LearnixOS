[workspace]

members = [
    "bootloader/first_stage",
    "bootloader/second_stage",
    "crates/arch/x86",
    "crates/common",
    "crates/macros/bitfields",
    # "crates/drivers/ahci",
    "crates/drivers/keyboard",
    # "crates/drivers/pci",
    "crates/drivers/vga-display",
    "crates/memory/buddy",
    "crates/memory/slab",
    "crates/memory/page",
    "crates/sync",
    "crates/libk",
    "kernel",
    # "snippets",
]

# xtask runs on the host and has its own workspace, so the bare-metal
# build target in `.cargo/config.toml` doesn't apply to it.
# typestate-groups is a submodule with its own workspace.
exclude = ["xtask", "crates/macros/typestate-groups"]

resolver = "2"

[workspace.lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
# overflow-checks = true
# Only `image-symbols/` keeps this, because `image.bin` holds loaded sections.
debug = true
codegen-units = 1
panic = "abort"

# The first stage must fit in the 512-byte boot sector and the second below
# the kernel at 0x10000, so xtask always builds them for size.
[profile.bootloader]
inherits = "release"
opt-level = 's'
