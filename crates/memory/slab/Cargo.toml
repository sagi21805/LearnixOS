[package]
name = "slab"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../../common" }
x86 = { path = "../../arch/x86" }
buddy = { path = "../buddy" }
sync = { path = "../../sync" }
num_enum = { git = "https://github.com/sagi21805/num_enum.git", default-features = false, features = [
    "complex-expressions",
] }
bitfields = { path = "../../macros/bitfields" }
strum_macros = { version = "0.27", default-features = false }
strum = { version = "0.27", default-features = false }
extend = "1.2.0"
nonmax = { version = "0.5.5", default-features = false }
typestate-groups = { path = "../../macros/typestate-groups/typestate-groups", default-features = false }
zerocopy = { version = "0.8.59", default-features = false, features = [
    "derive",
] }
